            echo "stability check passed: 6 of 6 runs"
            echo "=== disassembly check: each chase loop keeps its dependent load"
            for f in direct_chase seg256_chase ch2_chase ch2chk_chase; do n=$(otool -tV e4c_mac | awk "/^_$f:/{p=1;next} /^_[a-z0-9_]+:/{p=0} p" | grep -cE 'ldr'); echo "$f: $n ldr"; [ "$n" -ge 1 ]; done
