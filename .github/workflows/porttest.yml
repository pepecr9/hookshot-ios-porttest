      - name: E4-A and E6-probe - reservation-only test and MetalFX support query (macOS arm64)
        id: e4a
        if: always()
        run: |
          {
            clang -O2 -Wall -fobjc-arc e4a.m main_cli.c -DPT_ENTRY=e4a_all -framework Foundation -o e4a_mac && ./e4a_mac
            echo "=== signature reader check: sign a copy with one harmless custom entitlement and read it back"
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>com.example.e4a-ci-check</key><true/></dict></plist>\n' > ci_ent.plist
            cp e4a_mac e4a_mac_ent && codesign -s - -f --entitlements ci_ent.plist e4a_mac_ent
            E4A_EXE=e4a_mac_ent ./e4a_mac | tee e4a_ent.txt | grep -F '[signature]'   # read the signed copy without running it (macOS may refuse to launch it)
            grep -q 'com.example.e4a-ci-check: 1' e4a_ent.txt && echo "signature reader check passed"
            clang -O2 -Wall -fobjc-arc e6probe.m main_cli.c -DPT_ENTRY=e6probe_all -framework Foundation -framework Metal -weak_framework MetalFX -o e6probe_mac && ./e6probe_mac
          } 2>&1 | tee e4a_e6probe_mac_report.txt
      - name: E4-A and E6-probe - build the two IPAs (unsigned, only after the macOS run passed)
        if: always() && steps.e4a.outcome == 'success'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          T="-target arm64-apple-ios26.0 -isysroot $SDK"
          build() {   # $1 app/executable name, $2 bundle suffix, $3 display name, $4 source, $5 entry, $6 report file, $7 extra frameworks
            local A=Payload_$1/Payload/$1.app; mkdir -p obj_$1 "$A"
            clang $T -O2 -Wall -fobjc-arc -c $4 -o obj_$1/test.o
            clang $T -fobjc-arc -DPT_ENTRY=$5 -DPT_OUTFILE="\"$6\"" -c ios/main.m -o obj_$1/main.o
            clang $T -fobjc-arc obj_$1/*.o -framework UIKit -framework Foundation $7 -o "$A/$1"
            sed -e "s/es.pepecr9.hookshotporttest/es.pepecr9.$2/" -e "s/<string>HSPortTest</<string>$1</g" -e "s/HS PortTest/$3/" ios/Info.plist > "$A/Info.plist"
            plutil -lint "$A/Info.plist"; plutil -p "$A/Info.plist" | grep -E 'Identifier|Executable|DisplayName'
            otool -l "$A/$1" | grep -A4 LC_BUILD_VERSION | grep -E 'minos|sdk'
          }
          {
            build HSVMemTestA hsvmemtesta "HS E4-A" e4a.m e4a_all e4a_vmem.txt ""
            (cd Payload_HSVMemTestA && zip -qr ../HSVMemTest-E4A-unsigned.ipa Payload)
            build HSFXProbe hsfxprobe "HS FXProbe" e6probe.m e6probe_all e6_metalfx.txt "-framework Metal -weak_framework MetalFX"
            (cd Payload_HSFXProbe && zip -qr ../HSFXProbe-E6-unsigned.ipa Payload)
            ls -l HSVMemTest-E4A-unsigned.ipa HSFXProbe-E6-unsigned.ipa
          } 2>&1 | tee logs/15-build-ios-e4a-e6.txt
      - name: E4-C - 17.6 GB guest space in 2 MB chunks on first use, aliases, eviction (macOS arm64, six runs)
        id: e4c
        if: always()
        run: |
          {
            clang -O2 -Wall e4c.c main_cli.c -DPT_ENTRY=e4c_all -o e4c_mac && ./e4c_mac
