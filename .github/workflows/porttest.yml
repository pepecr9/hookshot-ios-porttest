name: hookshot-porttest
# Lifts a hand-written ARM64 instruction battery with Hookshot's lifter, checks it against the CPU on macOS arm64,
# and builds an unsigned iOS test IPA. No game files are used or needed.
on: [workflow_dispatch, push]
defaults:
  run:
    shell: bash   # (bash -eo pipefail: a failing command before | tee fails the step)
jobs:
  porttest:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOOKSHOT_COMMIT: b2765ba6c3988b0e722570e293720e6ec5b60ee3
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (iOS 26 SDK)
        run: |
          mkdir -p logs
          X=/Applications/Xcode_26.2.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          { uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; clang --version; python3 --version; } | tee logs/00-toolchain.txt
      - name: Hookshot at the analysed commit
        run: |
          git init -q hookshot && cd hookshot
          git remote add origin https://github.com/NotRexed/Hookshot.git
          git fetch -q --depth 1 origin "$HOOKSHOT_COMMIT" && git checkout -q FETCH_HEAD
          git log -1 --format='%H %ci %s' | tee ../logs/01-hookshot.txt
      - name: Python deps
        run: python3 -m pip install --break-system-packages capstone 2>&1 | tail -2
      - name: Lift (builds a64emit with clang++, then gen.py)
        run: python3 gen.py hookshot insns.bin gen 2>&1 | tee logs/02-lift.txt
      - name: Upstream LLVM (Homebrew)
        run: |
          brew install llvm 2>&1 | tail -1
          echo "LLVM=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
          "$(brew --prefix llvm)/bin/clang" --version | tee logs/00-llvm.txt
      - name: macOS arm64 - build (Apple clang and upstream LLVM)
        run: |
          CF="-O2 -fno-delete-null-pointer-checks -fno-strict-aliasing -DA64_MEM_ZERO -Wno-everything -Igen"
          {
            clang -c gen/native.S -o native.o
            for cc in apple llvm; do
              C=clang; [ $cc = llvm ] && C="$LLVM/clang -isysroot $(xcrun --show-sdk-path)"
              $C $CF -c gen/a64_suyu.c -o suyu_$cc.o
              $C $CF -c gen/lifted.c -o lifted_$cc.o
              $C $CF -c porttest.c -o porttest_$cc.o
              clang main_cli.c porttest_$cc.o lifted_$cc.o suyu_$cc.o native.o -o porttest_mac_$cc
              file porttest_mac_$cc
            done
          } 2>&1 | tee logs/03-build-mac.txt
      - name: Compiler check - the lifted UABD body, -O0 against each optimizing variant
        if: always()
        run: |
          MSDK=$(xcrun --show-sdk-path)
          clang -O0 -DNAME=f_O0 -c compiler_check/uabd_f.c -o uabd_O0.o
          check() {   # $1 label, rest: compiler and flags
            local label=$1; shift
            echo "=== $label"
            "$@" -DNAME=f_O2 -S -o - compiler_check/uabd_f.c | sed -n '/_f_O2:/,/ret/p' | grep -vE '^\s*(;|\.cfi)'
            "$@" -DNAME=f_O2 -c compiler_check/uabd_f.c -o uabd_X.o
            clang compiler_check/uabd_main.c uabd_O0.o uabd_X.o -o uabd_check && ./uabd_check || true
          }
          {
            check "Apple clang 17 -O2" clang -O2
            check "Apple clang 17 -O2 -fno-slp-vectorize" clang -O2 -fno-slp-vectorize
            check "upstream LLVM -O2" $LLVM/clang -isysroot "$MSDK" -O2
          } 2>&1 | tee logs/05-compiler-check.txt
      - name: macOS arm64 - Apple clang 17 build, 256 states (for the record)
        continue-on-error: true
        run: ./porttest_mac_apple 256 2>&1 | tee mac_report_appleclang.txt
      - name: macOS arm64 - upstream LLVM build, 256 states
        run: ./porttest_mac_llvm 256 2>&1 | tee mac_report_256.txt
      - name: macOS arm64 - upstream LLVM build, 4096 states
        run: ./porttest_mac_llvm 4096 2>&1 | tee mac_report.txt
      - name: iOS arm64 - build the test IPA (unsigned, only after the tests passed)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          T="-target arm64-apple-ios26.0 -isysroot $SDK"
          CF="$T -O2 -fno-delete-null-pointer-checks -fno-strict-aliasing -DA64_MEM_ZERO -Wno-everything -Igen"
          mkdir -p ios_obj Payload/HSPortTest.app
          {
            "$LLVM/clang" $CF -c gen/a64_suyu.c -o ios_obj/suyu.o   # (upstream LLVM: Apple clang 17 miscompiles UABD, see 05)
            "$LLVM/clang" $CF -c gen/lifted.c -o ios_obj/lifted.o
            "$LLVM/clang" $CF -c porttest.c -o ios_obj/porttest.o
            clang $T -c gen/native.S -o ios_obj/native.o
            clang $T -fobjc-arc -c ios/main.m -o ios_obj/main.o
            clang $T -fobjc-arc ios_obj/*.o -framework UIKit -framework Foundation -o Payload/HSPortTest.app/HSPortTest
            cp ios/Info.plist Payload/HSPortTest.app/
            plutil -lint Payload/HSPortTest.app/Info.plist
            file Payload/HSPortTest.app/HSPortTest
            otool -l Payload/HSPortTest.app/HSPortTest | grep -A4 LC_BUILD_VERSION
            zip -qr HSPortTest-unsigned.ipa Payload
            ls -l HSPortTest-unsigned.ipa
          } 2>&1 | tee logs/04-build-ios.txt
          cp ios/entitlements.plist .
      - name: E1 - file-backed memory on macOS arm64
        if: always()
        run: |
          { df -h "$TMPDIR" | tail -1; clang -O2 -Wall e1.c main_cli.c -DPT_ENTRY=e1_all -o e1_mac && ./e1_mac; } 2>&1 | tee e1_mac_report.txt
      - name: E1 - build HSFileTest IPA (unsigned, only after E1 passed on macOS)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          T="-target arm64-apple-ios26.0 -isysroot $SDK"
          A=PayloadE1/Payload/HSFileTest.app
          mkdir -p ios_e1 "$A"
          {
            clang $T -O2 -c e1.c -o ios_e1/e1.o
            clang $T -fobjc-arc -DPT_ENTRY=e1_all -DPT_OUTFILE='"e1_filemem.txt"' -c ios/main.m -o ios_e1/main.o
            clang $T -fobjc-arc ios_e1/*.o -framework UIKit -framework Foundation -o "$A/HSFileTest"
            sed -e 's/es.pepecr9.hookshotporttest/es.pepecr9.hsfiletest/' -e 's/<string>HSPortTest</<string>HSFileTest</g' \
                -e 's/HS PortTest/HS FileTest/' ios/Info.plist > "$A/Info.plist"
            plutil -lint "$A/Info.plist"; plutil -p "$A/Info.plist" | grep -E 'Identifier|Executable|DisplayName'
            file "$A/HSFileTest"; otool -l "$A/HSFileTest" | grep -A4 LC_BUILD_VERSION
            (cd PayloadE1 && zip -qr ../HSFileTest-E1-unsigned.ipa Payload)
            ls -l HSFileTest-E1-unsigned.ipa
          } 2>&1 | tee logs/06-build-ios-e1.txt
      - name: E1-Safe - file-backed memory on macOS arm64 (128 + 256 MB, no spill)
        id: e1safe
        if: always()
        run: |
          { df -h "$TMPDIR" | tail -1; clang -O2 -Wall e1_safe.c main_cli.c -DPT_ENTRY=e1_safe_all -o e1_safe_mac && ./e1_safe_mac; } 2>&1 | tee e1_safe_mac_report.txt
      - name: E1-Safe - build HSFileTest-E1-Safe IPA (unsigned, only after E1-Safe passed on macOS)
        if: always() && steps.e1safe.outcome == 'success'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          T="-target arm64-apple-ios26.0 -isysroot $SDK"
          A=PayloadSafe/Payload/HSFileSafe.app
          mkdir -p ios_safe "$A"
          {
            clang $T -O2 -c e1_safe.c -o ios_safe/e1_safe.o
            clang $T -fobjc-arc -DPT_ENTRY=e1_safe_all -DPT_OUTFILE='"e1_safe.txt"' -c ios/main.m -o ios_safe/main.o
            clang $T -fobjc-arc ios_safe/*.o -framework UIKit -framework Foundation -o "$A/HSFileSafe"
            sed -e 's/es.pepecr9.hookshotporttest/es.pepecr9.hsfilesafe/' -e 's/<string>HSPortTest</<string>HSFileSafe</g' \
                -e 's/HS PortTest/HS FileSafe/' ios/Info.plist > "$A/Info.plist"
            plutil -lint "$A/Info.plist"; plutil -p "$A/Info.plist" | grep -E 'Identifier|Executable|DisplayName'
            file "$A/HSFileSafe"; otool -l "$A/HSFileSafe" | grep -A4 LC_BUILD_VERSION
            (cd PayloadSafe && zip -qr ../HSFileTest-E1-Safe-unsigned.ipa Payload)
            ls -l HSFileTest-E1-Safe-unsigned.ipa
          } 2>&1 | tee logs/07-build-ios-e1-safe.txt
      - name: E1-LowDisk - file-backed memory on macOS arm64 (64 + 128 MB, 1 GB disk margin)
        id: e1low
        if: always()
        run: |
          {
            df -h "$TMPDIR" | tail -1
            clang -O2 -Wall e1_lowdisk.c main_cli.c -DPT_ENTRY=e1_lowdisk_all -o e1_lowdisk_mac && ./e1_lowdisk_mac
            echo "=== refusal check: a 100000 GB margin must stop before writing anything"
            clang -O2 -Wall e1_lowdisk.c main_cli.c -DPT_ENTRY=e1_lowdisk_all '-DGUARD_DISK=(100000*GB)' -o e1_lowdisk_refuse
            if ./e1_lowdisk_refuse > refuse.txt; then cat refuse.txt; echo "refusal check FAILED: it ran"; exit 1; fi
            cat refuse.txt; grep -q 'not starting' refuse.txt && ! grep -q 'seq write' refuse.txt && echo "refusal check passed"
          } 2>&1 | tee e1_lowdisk_mac_report.txt
      - name: E1-LowDisk - build HSFileTest-E1-LowDisk IPA (unsigned, only after E1-LowDisk passed on macOS)
        if: always() && steps.e1low.outcome == 'success'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          T="-target arm64-apple-ios26.0 -isysroot $SDK"
          A=PayloadLow/Payload/HSFileLowDisk.app
          mkdir -p ios_low "$A"
          {
            clang $T -O2 -c e1_lowdisk.c -o ios_low/e1_lowdisk.o
            clang $T -fobjc-arc -DPT_ENTRY=e1_lowdisk_all -DPT_OUTFILE='"e1_lowdisk.txt"' -c ios/main.m -o ios_low/main.o
            clang $T -fobjc-arc ios_low/*.o -framework UIKit -framework Foundation -o "$A/HSFileLowDisk"
            sed -e 's/es.pepecr9.hookshotporttest/es.pepecr9.hsfilelowdisk/' -e 's/<string>HSPortTest</<string>HSFileLowDisk</g' \
                -e 's/HS PortTest/HS LowDisk/' ios/Info.plist > "$A/Info.plist"
            plutil -lint "$A/Info.plist"; plutil -p "$A/Info.plist" | grep -E 'Identifier|Executable|DisplayName'
            file "$A/HSFileLowDisk"; otool -l "$A/HSFileLowDisk" | grep -A4 LC_BUILD_VERSION
            (cd PayloadLow && zip -qr ../HSFileTest-E1-LowDisk-unsigned.ipa Payload)
            ls -l HSFileTest-E1-LowDisk-unsigned.ipa
          } 2>&1 | tee logs/08-build-ios-e1-lowdisk.txt
      - name: E1.5 - page release and recovery on macOS arm64 (128 + 256 MB)
        id: e15
        if: always()
        run: |
          {
            df -h "$TMPDIR" | tail -1
            grep -n 'MADV_PAGEOUT\|MADV_DONTNEED\|MS_INVALIDATE' "$(xcrun --sdk iphoneos --show-sdk-path)/usr/include/sys/mman.h" || true
            clang -O2 -Wall e1_5.c main_cli.c -DPT_ENTRY=e15_all -o e15_mac && ./e15_mac
          } 2>&1 | tee e1_5_mac_report.txt
      - name: E1.5 - build HSFileTest-E1.5 IPA (unsigned, only after E1.5 passed on macOS)
        if: always() && steps.e15.outcome == 'success'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          T="-target arm64-apple-ios26.0 -isysroot $SDK"
          A=Payload15/Payload/HSFileTest15.app
          mkdir -p ios_15 "$A"
          {
            clang $T -O2 -Wall -c e1_5.c -o ios_15/e1_5.o
            clang $T -fobjc-arc -DPT_ENTRY=e15_all -DPT_OUTFILE='"e1_5.txt"' -c ios/main.m -o ios_15/main.o
            clang $T -fobjc-arc ios_15/*.o -framework UIKit -framework Foundation -o "$A/HSFileTest15"
            sed -e 's/es.pepecr9.hookshotporttest/es.pepecr9.hsfiletest15/' -e 's/<string>HSPortTest</<string>HSFileTest15</g' \
                -e 's/HS PortTest/HS E1.5/' ios/Info.plist > "$A/Info.plist"
            plutil -lint "$A/Info.plist"; plutil -p "$A/Info.plist" | grep -E 'Identifier|Executable|DisplayName'
            file "$A/HSFileTest15"; otool -l "$A/HSFileTest15" | grep -A4 LC_BUILD_VERSION
            (cd Payload15 && zip -qr ../HSFileTest-E1.5-unsigned.ipa Payload)
            ls -l HSFileTest-E1.5-unsigned.ipa
          } 2>&1 | tee logs/09-build-ios-e1-5.txt
      - name: E2 - Metal capabilities and texture memory on macOS arm64
        id: e2
        if: always()
        run: |
          {
            system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Chipset|Metal|Cores' || true
            clang -O2 -Wall -fobjc-arc e2.m main_cli.c -DPT_ENTRY=e2_all -framework Metal -framework Foundation -o e2_mac && ./e2_mac
          } 2>&1 | tee e2_mac_report.txt
      - name: E2 - BC1/BC3/BC7 to ASTC 4x4 transcode study (public tools, synthetic images; macOS only)
        if: always()
        continue-on-error: true
        run: |
          {
            git clone -q --depth 1 --branch 5.3.0 https://github.com/ARM-software/astc-encoder.git astcsrc
            cmake -S astcsrc -B astcsrc/build -DCMAKE_BUILD_TYPE=Release -DASTCENC_ISA_NEON=ON > /dev/null
            cmake --build astcsrc/build -j 4 > /dev/null
            ASTCENC=$(find astcsrc/build -type f -name 'astcenc-neon' | head -1); echo "astcenc: $ASTCENC (ARM astc-encoder 5.3.0, built here)"
            python3 -m pip install --break-system-packages numpy pillow etcpak texture2ddecoder 2>&1 | tail -1
            python3 e2_bcastc.py "$ASTCENC" e2_work
          } 2>&1 | tee e2_bcastc_report.txt
      - name: E2 - build HSMetalTest-E2 IPA (unsigned, only after E2 passed on macOS)
        if: always() && steps.e2.outcome == 'success'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          T="-target arm64-apple-ios26.0 -isysroot $SDK"
          A=PayloadE2/Payload/HSMetalTest.app
          mkdir -p ios_e2 "$A"
          {
            clang $T -O2 -Wall -fobjc-arc -c e2.m -o ios_e2/e2.o
            clang $T -fobjc-arc -DPT_ENTRY=e2_all -DPT_OUTFILE='"e2_metal.txt"' -c ios/main.m -o ios_e2/main.o
            clang $T -fobjc-arc ios_e2/*.o -framework UIKit -framework Foundation -framework Metal -o "$A/HSMetalTest"
            sed -e 's/es.pepecr9.hookshotporttest/es.pepecr9.hsmetaltest/' -e 's/<string>HSPortTest</<string>HSMetalTest</g' \
                -e 's/HS PortTest/HS MetalTest/' ios/Info.plist > "$A/Info.plist"
            plutil -lint "$A/Info.plist"; plutil -p "$A/Info.plist" | grep -E 'Identifier|Executable|DisplayName'
            file "$A/HSMetalTest"; otool -l "$A/HSMetalTest" | grep -A4 LC_BUILD_VERSION; otool -L "$A/HSMetalTest" | grep -i metal
            (cd PayloadE2 && zip -qr ../HSMetalTest-E2-unsigned.ipa Payload)
            ls -l HSMetalTest-E2-unsigned.ipa
          } 2>&1 | tee logs/10-build-ios-e2.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hookshot-porttest
          retention-days: 7
          path: |
            logs/
            mac_report.txt
            mac_report_256.txt
            mac_report_appleclang.txt
            HSPortTest-unsigned.ipa
            HSFileTest-E1-unsigned.ipa
            e1_mac_report.txt
            HSFileTest-E1-Safe-unsigned.ipa
            e1_safe_mac_report.txt
            HSFileTest-E1-LowDisk-unsigned.ipa
            e1_lowdisk_mac_report.txt
            HSFileTest-E1.5-unsigned.ipa
            e1_5_mac_report.txt
            HSMetalTest-E2-unsigned.ipa
            e2_mac_report.txt
            e2_bcastc_report.txt
            entitlements.plist
            gen/lifted.c
